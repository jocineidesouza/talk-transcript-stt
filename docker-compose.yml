services:
  stt:
    build:
      context: ./stt
    container_name: stt
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      MODEL_NAME: sherpa-onnx-nemo-stt_pt_fastconformer_hybrid_large_pc-int8
      MODEL_DIR: /models/sherpa-onnx-nemo-stt_pt_fastconformer_hybrid_large_pc-int8
      VAD_MODEL: /models/silero_vad.onnx
      SHERPA_NUM_THREADS: "3"
      DECODE_MAX_CONCURRENCY: "1"
      UVICORN_WORKERS: "1"
      SAMPLE_RATE: "16000"
      FEATURE_DIM: "80"
      MODEL_LANGUAGE: pt-BR
      MODEL_TYPE: nemo_ctc_offline_vad_streaming
      USE_INTERNAL_VAD: "false"
      AUTO_DOWNLOAD_MODEL: "1"
      LOG_LEVEL: INFO
    volumes:
      - ./stt/models:/models
    tmpfs:
      - /tmp:size=256m
