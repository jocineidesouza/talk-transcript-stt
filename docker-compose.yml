services:
  stt:
    build:
      context: ./stt
    container_name: stt
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    ports:
      - "3001:3001"
    environment:
      MODEL_NAME: sherpa-onnx-cohere-transcribe-14-lang-int8-2026-04-01
      MODEL_DIR: /models/sherpa-onnx-cohere-transcribe-14-lang-int8-2026-04-01
      SHERPA_NUM_THREADS: "3"
      DECODE_MAX_CONCURRENCY: "1"
      UVICORN_WORKERS: "1"
      SAMPLE_RATE: "16000"
      FEATURE_DIM: "80"
      MODEL_LANGUAGE: pt
      MODEL_TYPE: cohere_transcribe_offline_vad_streaming
      APP_VERSION: "1.00.01"
      AUTO_DOWNLOAD_MODEL: "1"
      SQLITE_PATH: /data/queue.db
      SPOOL_DIR: /data/spool
      QUEUE_MAX_PENDING: "2000"
      ROOM_INACTIVITY_TIMEOUT_SECONDS: "1800"
      HMAC_WINDOW_SECONDS: "300"
      STT_HMAC_KEY_ID: default
      STT_HMAC_SECRET: flamengo
      FIREBASE_ENABLED: "true"
      FIREBASE_FLUSH_INTERVAL_SECONDS: "300"
      STORAGE_MINUTE_WINDOW_SECONDS: "600"
      FIREBASE_NAMESPACE_CONFIG_JSON: >-
        {"talk__dev":{"project_id":"dev-atendo","storage_bucket":"dev-atendo.appspot.com","credentials_file":"/secrets/talk-dev-firebaseadmin.json"},"talk__stg":{"project_id":"stage-atendo","storage_bucket":"stage-atendo.appspot.com","credentials_file":"/secrets/talk-stg-firebaseadmin.json"},"talk__prd":{"project_id":"dev-atendo","storage_bucket":"dev-atendo.appspot.com","credentials_file":"/secrets/talk-prd-firebaseadmin.json"},"ellevo-connect__dev":{"project_id":"ellevo-connect-dev","storage_bucket":"ellevo-connect-dev.firebasestorage.app","credentials_file":"/secrets/ellevo-connect-dev-firebaseadmin.json"},"ellevo-connect__stg":{"project_id":"ellevo-connect-stg","storage_bucket":"ellevo-connect-stg.firebasestorage.app","credentials_file":"/secrets/ellevo-connect-stg-firebaseadmin.json"},"ellevo-connect__prd":{"project_id":"ellevo-connect","storage_bucket":"ellevo-connect.firebasestorage.app","credentials_file":"/secrets/ellevo-connect-prd-firebaseadmin.json"}}
      SUMMARY_ENABLED: "true"
      SUMMARY_PROVIDER: "openrouter"
      SUMMARY_MODEL_MINUTE: "gpt-4.1-mini"
      SUMMARY_MODEL_ACCUMULATED: "gpt-4.1-mini"
      SUMMARY_MODEL_FINAL: "gpt-4.1-mini"
      SUMMARY_MODEL_FINAL_TEXT: "gpt-4.1-mini"
      SUMMARY_FINAL_TEXT_FORMAT: "html"
      SUMMARY_REQUEST_TIMEOUT_SECONDS: "300"
      SUMMARY_REQUEST_RETRIES: "2"
      SUMMARY_REQUEST_RETRY_BASE_SECONDS: "1.5"
      SUMMARY_MAX_RETRIES: "3"
      SUMMARY_ACCUMULATED_MAX_ITEMS: "40"
      OPENAI_APIKEY_FILE: /secrets/openai_apikey.json
      OPENROUTER_APIKEY_FILE: /secrets/openrouter_apikey.json
      OPENAI_BASE_URL: "https://api.openai.com/v1"
      OPENROUTER_BASE_URL: "https://openrouter.ai/api/v1"
      OPENROUTER_HTTP_REFERER: ""
      OPENROUTER_X_TITLE: ""
      SUMMARY_RECONCILE_INTERVAL_SECONDS: "60"
      SUMMARY_PROCESSING_STALE_SECONDS: "300"
      SUMMARY_FINALIZATION_GRACE_SECONDS: "180"
      SUMMARY_FINAL_REEMIT_ON_LATE_MINUTES: "true"
      SUMMARY_FINAL_ENABLE_DETERMINISTIC_FALLBACK: "true"
      LOG_LEVEL: INFO
    volumes:
      - ./stt/models:/models
      - ./stt/data:/data
      - ./stt/secrets:/secrets:ro
    tmpfs:
      - /tmp:size=256m
