services:
  stt:
    build:
      context: ./stt
    container_name: stt
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      MODEL_NAME: sherpa-onnx-cohere-transcribe-14-lang-int8-2026-04-01
      MODEL_DIR: /models/sherpa-onnx-cohere-transcribe-14-lang-int8-2026-04-01
      SHERPA_NUM_THREADS: "3"
      DECODE_MAX_CONCURRENCY: "1"
      UVICORN_WORKERS: "1"
      SAMPLE_RATE: "16000"
      FEATURE_DIM: "80"
      MODEL_LANGUAGE: pt
      MODEL_TYPE: cohere_transcribe_offline_vad_streaming
      AUTO_DOWNLOAD_MODEL: "1"
      SQLITE_PATH: /data/queue.db
      SPOOL_DIR: /data/spool
      QUEUE_MAX_PENDING: "2000"
      ROOM_INACTIVITY_TIMEOUT_SECONDS: "1800"
      HMAC_WINDOW_SECONDS: "300"
      STT_HMAC_KEY_ID: default
      STT_HMAC_SECRET: flamengo
      FIREBASE_ENABLED: "true"
      FIREBASE_FLUSH_INTERVAL_SECONDS: "30"
      STORAGE_MINUTE_WINDOW_SECONDS: "60"
      FIREBASE_NAMESPACE_CONFIG_JSON: >-
        {"talk__dev":{"project_id":"dev-atendo","storage_bucket":"dev-atendo.appspot.com","credentials_file":"/secrets/talk-dev-firebaseadmin.json"},"talk__stg":{"project_id":"stage-atendo","storage_bucket":"stage-atendo.appspot.com","credentials_file":"/secrets/talk-stg-firebaseadmin.json"},"talk__prd":{"project_id":"dev-atendo","storage_bucket":"dev-atendo.appspot.com","credentials_file":"/secrets/talk-prd-firebaseadmin.json"},"ellevo-connect__dev":{"project_id":"ellevo-connect-dev","storage_bucket":"ellevo-connect-dev.firebasestorage.app","credentials_file":"/secrets/ellevo-connect-dev-firebaseadmin.json"},"ellevo-connect__stg":{"project_id":"ellevo-connect-stg","storage_bucket":"ellevo-connect-stg.firebasestorage.app","credentials_file":"/secrets/ellevo-connect-stg-firebaseadmin.json"},"ellevo-connect__prod":{"project_id":"ellevo-connect","storage_bucket":"ellevo-connect.firebasestorage.app","credentials_file":"/secrets/ellevo-connect-prd-firebaseadmin.json"}}
      OPENAI_SUMMARY_ENABLED: "true"
      OPENAI_APIKEY_FILE: /secrets/openai_apikey.json
      OPENAI_MODEL_MINUTE_SUMMARY: "gpt-4.1-mini"
      OPENAI_MODEL_ACCUMULATED_SUMMARY: "gpt-4.1"
      OPENAI_MODEL_FINAL_SUMMARY: "gpt-4.1"
      OPENAI_REQUEST_TIMEOUT_SECONDS: "20"
      OPENAI_MAX_RETRIES: "3"
      LOG_LEVEL: INFO
    volumes:
      - ./stt/models:/models
      - ./stt/data:/data
      - ./stt/secrets:/secrets:ro
    tmpfs:
      - /tmp:size=256m
